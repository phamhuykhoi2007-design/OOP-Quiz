<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn tập & Thi thử Lập trình hướng đối tượng (C#)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2.2">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-badge"><span class="brand-emoji">🎓</span></span>
        <div class="brand-text">
          <span class="brand-name">Ôn tập <b>Lập trình hướng đối tượng</b></span>
          <span class="brand-sub">C# · Kho 600 TN &amp; 300 Tự luận</span>
        </div>
      </div>
      <div class="modeswitch" role="group" aria-label="Chế độ học tập">
        <button id="practiceModeBtn" class="modebtn active" type="button" aria-pressed="true">📖 Ôn tập</button>
        <button id="examModeBtn" class="modebtn" type="button" aria-pressed="false">⏱️ Làm bài thi (80 phút)</button>
      </div>
      <div class="topbar-right">
        <span id="examFormatText" class="exam-format">40 Trắc nghiệm · 5 Tự luận</span>
        <div id="examTimerBadge" class="timer-badge hidden" role="timer" aria-label="Thời gian còn lại">
          <span class="timer-pulse" aria-hidden="true"></span>
          <span class="timer-icon" aria-hidden="true">⏳</span>
          <span id="timerText">80:00</span>
        </div>
        <button id="submitExamBtn" class="submit-exam-btn hidden" type="button">Nộp bài thi ✓</button>
        <button id="newExamBtn" class="regenbtn" type="button">Tạo đề mới 🎲</button>
        <button id="clearBtn" class="ghost-btn" type="button">Xóa bài làm</button>
      </div>
    </div>
  </header>

  <div class="exam-toolbar">
    <div class="toolbar-nav-row">
      <div class="toolbar-nav-group">
        <nav class="chapters-inner" aria-label="Phần bài thi">
          <button class="pill" id="mcqTab" type="button">Trắc nghiệm · 40 câu</button>
          <button class="pill" id="essayTab" type="button">Tự luận điền khuyết · 5 bài</button>
          <button class="pill" id="summaryBtn" type="button">Tổng kết</button>
        </nav>
        <button class="pill pill-action" id="newEssaysBtn" type="button">🔄 Đổi 5 bài tự luận</button>
      </div>
      <p id="progressText" class="progress-text" aria-live="polite"></p>
    </div>
    <div class="progress-track" aria-hidden="true">
      <div id="examProgressBar" class="progress-fill" style="width: 0%"></div>
    </div>
  </div>
  <p id="storageNotice" class="storage-notice hidden" role="status"></p>

  <main id="app"></main>

<script src="mcq-generators.js"></script>
<script src="essay-generators.js"></script>
<script src="exam-core.js"></script>
<script src="exam-app.js"></script>
</body>
</html>
